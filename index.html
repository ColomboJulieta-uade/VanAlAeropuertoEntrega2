<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van al Aeropuerto · Panel de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#F26A1B; --brand-600:#D9580D; --brand-700:#B4470A; --brand-50:#FFF5EE; --brand-100:#FFE6D4; --brand-200:#FFCFAE;
  --ink:#1D2430; --ink-2:#4E5561; --muted:#7A8291; --line:#E4E7EC; --line-2:#EEF0F3;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --green:#1F8A47; --green-50:#EAF6EE; --red:#CF3425; --red-50:#FDEDEB; --amber:#B7791F; --amber-50:#FDF5E6;
  --blue:#2F5FC4; --blue-50:#EDF2FC; --violet:#6B4FBB; --violet-50:#F2EEFB; --gray-50:#F1F2F4;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px} svg.i.lg{width:22px;height:22px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--line-2)}
.brand .t1{font-weight:700;font-size:15.5px;line-height:1.1}
.brand .t2{font-size:12px;color:var(--muted)}
.nav{padding:12px 10px;overflow:auto;flex:1}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;margin-bottom:1px}
.nav a:hover{background:var(--gray-50);text-decoration:none;color:var(--ink)}
.nav a.on{background:var(--brand-50);color:var(--brand-700)}
.nav a.on svg{color:var(--brand)}
.nav a .cnt{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--brand);color:#fff;border-radius:20px;padding:0 7px;line-height:18px}
.nav a .cnt.red{background:var(--red)}
.side-foot{border-top:1px solid var(--line-2);padding:12px 14px;font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:62px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
.top h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top>div:nth-child(2){min-width:0;flex:0 1 auto}
.top .crumb{font-size:12px;color:var(--muted);white-space:nowrap}
.top .grow{flex:1}
.searchbox{position:relative;width:min(320px,26vw)}
.searchbox input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px 0 34px;background:var(--surface-2)}
.searchbox input:focus{outline:2px solid var(--brand-200);border-color:var(--brand);background:#fff}
.searchbox svg{position:absolute;left:10px;top:9px;color:var(--muted)}
.dd{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.10);min-width:100%;z-index:50;max-height:420px;overflow:auto}
.dd .it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;color:var(--ink)}
.dd .it:hover{background:var(--surface-2);text-decoration:none}
.dd .hd{padding:10px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between}
.iconbtn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--gray-50)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:0 5px;line-height:17px;border:2px solid #fff}
.clock{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);border:1px dashed var(--line);border-radius:8px;padding:4px 6px 4px 10px;white-space:nowrap}
.clock b{font-family:var(--mono);font-weight:500}
.clock button{border:0;background:var(--gray-50);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.clock button:hover{background:var(--brand-100);color:var(--brand-700)}
.profile{position:relative}
.profile>button{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:4px 10px 4px 4px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:7px;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.avatar.g{background:#E7EBF3;color:#344054}
.profile .nm{font-size:12.5px;font-weight:600;line-height:1.1;text-align:left;white-space:nowrap}
.profile .rl{font-size:11px;color:var(--muted);text-align:left}
.content{padding:22px 24px 48px;max-width:1440px;width:100%}
.menu-btn{display:none}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:14.5px}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-b{padding:16px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.stack>*+*{margin-top:16px}
.stack-s>*+*{margin-top:10px}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mb{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--gray-50);text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-600)}
.btn.soft{background:var(--brand-50);border-color:var(--brand-100);color:var(--brand-700)}
.btn.soft:hover{background:var(--brand-100)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ok:hover{filter:brightness(.95)}
.btn.danger{color:var(--red);border-color:#F3C6C0}
.btn.danger:hover{background:var(--red-50)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--gray-50)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.nodot::before{display:none}
.t-gray{background:var(--gray-50);color:#495363;border-color:#E3E6EA}
.t-blue{background:var(--blue-50);color:var(--blue);border-color:#D6E1F7}
.t-amber{background:var(--amber-50);color:var(--amber);border-color:#F3E2BF}
.t-orange{background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-200)}
.t-red{background:var(--red-50);color:var(--red);border-color:#F5C9C3}
.t-green{background:var(--green-50);color:var(--green);border-color:#CBE8D5}
.t-violet{background:var(--violet-50);color:var(--violet);border-color:#E0D8F5}
.t-dark{background:#EDEFF2;color:#2B3340;border-color:#DADDE3}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--gray-50);color:var(--ink-2);white-space:nowrap}
.pill.demo{background:#FFF8E6;color:#8A5A00;border:1px dashed #E9C97A}
.pill.future{background:#F2F0FA;color:#5B47A6;border:1px dashed #C8BEEA}
.pill.real{background:var(--green-50);color:var(--green)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--gray-50);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}

/* tables */
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.2px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FCFCFD}
.tbl tr.sel td{background:var(--brand-50)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .strong{font-weight:600}
.tbl .mono,.tbl b.mono{white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* forms */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.inp,select.inp,textarea.inp{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;min-width:0;width:100%}
textarea.inp{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.inp:focus{outline:2px solid var(--brand-200);border-color:var(--brand)}
.inp.err{border-color:var(--red);background:#FFFBFA}
.ferr{font-size:11.5px;color:var(--red)}
.hint{font-size:11.5px;color:var(--muted)}
.filters .inp{width:auto;min-width:130px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:0 12px;height:34px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand-50);color:var(--brand-700)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--brand);width:16px;height:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tabs button.on{color:var(--brand-700);border-color:var(--brand)}
.tabs button .cnt{font-size:11px;background:var(--gray-50);border-radius:10px;padding:0 6px}
.tabs button.on .cnt{background:var(--brand-100)}

/* KPI */
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:104px;cursor:pointer;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--radius)}
.kpi:hover{border-color:var(--brand-200)}
.kpi .k{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;gap:7px;align-items:center}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .k svg{color:var(--brand)}

/* page head */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font-size:21px}
.ph .desc{color:var(--muted);font-size:13px;margin-top:3px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* alerts list */
.alert-it{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.alert-it:last-child{border-bottom:0}
.alert-it .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.alert-it .ic.red{background:var(--red-50);color:var(--red)}
.alert-it .ic.amber{background:var(--amber-50);color:var(--amber)}
.alert-it .ic.orange{background:var(--brand-50);color:var(--brand-600)}
.alert-it .ic.blue{background:var(--blue-50);color:var(--blue)}
.alert-it .ttl{font-weight:600;font-size:13px}
.alert-it .dsc{font-size:12.5px;color:var(--ink-2)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:9px;font-size:13px;border:1px solid}
.banner.info{background:var(--blue-50);border-color:#D6E1F7;color:#26457F}
.banner.warn{background:var(--amber-50);border-color:#F3E2BF;color:#7A5110}
.banner.err{background:var(--red-50);border-color:#F5C9C3;color:#8F2418}
.banner.ok{background:var(--green-50);border-color:#CBE8D5;color:#17643A}
.banner.brand{background:var(--brand-50);border-color:var(--brand-100);color:var(--brand-700)}

/* ficha */
.blk{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.blk-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:13.5px}
.blk-h .n{width:20px;height:20px;border-radius:6px;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center;font-size:11px;font-weight:700}
.blk-b{padding:14px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.kv.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv .f{border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:7px 10px;min-width:0}
.kv .f .l{font-size:11.5px;color:var(--muted)}
.kv .f .v{font-weight:500;overflow-wrap:anywhere}
.kv .f.full{grid-column:1/-1}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 26px}
.timeline li::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dt{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.timeline .dt.g{border-color:var(--green);background:var(--green)}
.timeline .dt.r{border-color:var(--red);background:var(--red)}
.timeline .dt.p{border-color:var(--line);background:#fff;border-style:dashed}
.timeline .tt{font-weight:600;font-size:13px}
.timeline .ts{font-size:11.5px;color:var(--muted)}
.timeline .td{font-size:12.5px;color:var(--ink-2)}
.timeline li.future .tt{color:var(--muted);font-weight:500}

/* driver cards */
.dcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:flex-start;background:#fff}
.dcard.best{border-color:var(--brand-200);background:#FFFCFA}
.dcard.ok{border-color:#BFE3CB;background:#F8FCF9}
.rank{width:34px;height:34px;border-radius:9px;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.rank small{font-size:9px;font-weight:600;display:block;line-height:1;margin-top:-2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.ck{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--green-50);color:var(--green)}
.ck.no{background:var(--red-50);color:var(--red)}
.ck.neu{background:var(--gray-50);color:var(--ink-2)}

/* calendar */
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.cal-week .col{border-right:1px solid var(--line-2);min-height:420px;display:flex;flex-direction:column}
.cal-week .col:last-child{border-right:0}
.cal-week .dh{padding:9px 10px;border-bottom:1px solid var(--line-2);background:var(--surface-2);font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;cursor:pointer}
.cal-week .dh b{font-size:15px;color:var(--ink)}
.cal-week .col.today .dh{background:var(--brand-50)}
.cal-week .col.today .dh b{color:var(--brand-700)}
.cal-week .evs{padding:6px;display:flex;flex-direction:column;gap:6px}
.ev{border-radius:7px;padding:6px 8px;font-size:12px;cursor:pointer;border:1px solid;border-left-width:3px;background:#fff;line-height:1.3}
.ev:hover{filter:brightness(.98);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ev .h{font-weight:700;font-family:var(--mono);font-size:11.5px}
.ev .p{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .r,.ev .d{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.s-conf{border-color:#CBE8D5;border-left-color:var(--green);background:#F7FCF9}
.ev.s-curso{border-color:#D6E1F7;border-left-color:var(--blue);background:#F6F9FE}
.ev.s-fin{border-color:#E3E6EA;border-left-color:#8B93A1;background:#FAFAFB;color:#5d6574}
.ev.s-pend{border-style:dashed;border-color:var(--brand-200);border-left-style:solid;border-left-color:var(--brand);background:#FFFBF8}
.ev.s-canc{border-color:#F5C9C3;border-left-color:var(--red);background:#FFF8F7;text-decoration:line-through}
.cal-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.cal-month .wd{padding:8px 10px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.cal-month .cell{min-height:104px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px;display:flex;flex-direction:column;gap:4px}
.cal-month .cell:nth-child(7n){border-right:0}
.cal-month .cell .n{font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.cal-month .cell.out{background:#FCFCFD}
.cal-month .cell.out .n{color:#B6BCC6}
.cal-month .cell.today .n{color:#fff;background:var(--brand);border-radius:6px;padding:0 6px;align-self:flex-start}
.mini-ev{font-size:11px;border-radius:5px;padding:2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.mini-ev.s-conf{background:#F1F9F4;border-color:var(--green)}
.mini-ev.s-curso{background:#EEF3FC;border-color:var(--blue)}
.mini-ev.s-fin{background:#F3F4F6;border-color:#8B93A1;color:#5d6574}
.mini-ev.s-pend{background:#FFF5EE;border-color:var(--brand)}
.mini-ev.s-canc{background:#FDEDEB;border-color:var(--red);text-decoration:line-through}
.cal-day{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:auto}
.cal-day .inner{min-width:1500px}
.cal-day .hrs{display:grid;grid-template-columns:190px 1fr;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.cal-day .hrs .scale{position:relative;height:30px}
.cal-day .hrs .scale span{position:absolute;top:8px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.cal-day .lane{display:grid;grid-template-columns:190px 1fr;border-bottom:1px solid var(--line-2);min-height:62px}

const drv = id => S.drivers.find(x => x.id === id);
const resv = id => S.reservations.find(x => x.id === id);
const rankPos = id => S.ranking.order.indexOf(id) + 1;
const driverName = id => id ? (drv(id)?.name || '—') : '—';

function flightCheck(r) {
  if (!r.airport || r.airport === 'BQB') return { k: 'na', label: 'No aplica', tone: 't-gray', detail: r.airport === 'BQB' ? 'Terminal fluvial: sin validación de vuelo' : 'Traslado urbano sin vuelo' };
  if (!r.flight) return { k: 'pend', label: 'Información de vuelo pendiente', tone: 't-amber', detail: 'Falta el número de vuelo para validar el horario' };
  const f = FLIGHTS[String(r.flight).toUpperCase().replace(/\s/g, '')];
  if (!f) return { k: 'pend', label: 'Información de vuelo pendiente', tone: 't-amber', detail: `El vuelo ${r.flight} no figura en la tabla local de simulación` };
  const [type, ap, ft] = f;
  const diff = toMin(r.time) - toMin(ft); // minutos (+ = después del vuelo)
  if (ap !== r.airport) return { k: 'rev', label: 'Revisar horario', tone: 't-red', detail: `El vuelo ${r.flight} opera en ${AIRPORTS[ap].short}, no en ${AIRPORTS[r.airport].short}`, f };
  if (type === 'Arribo') {
    if (diff >= 0 && diff <= 60) return { k: 'ok', label: 'Horario validado', tone: 't-green', detail: `Arribo ${ft} · búsqueda ${r.time} coincide con el vuelo`, f };
    return { k: 'rev', label: 'Revisar horario', tone: 't-red', detail: `El vuelo arriba a las ${ft} y la búsqueda está cargada a las ${r.time}${Math.abs(Math.abs(diff) - 720) <= 60 ? ' (posible confusión AM/PM)' : ''}`, f };
  }
  const before = -diff, min = ap === 'EZE' ? 180 : 120, max = ap === 'EZE' ? 270 : 240;
  if (before >= min && before <= max) return { k: 'ok', label: 'Horario validado', tone: 't-green', detail: `Partida ${ft} · salida ${r.time} con ${Math.floor(before / 60)} h ${pad(before % 60)} min de anticipación`, f };
  return { k: 'rev', label: 'Revisar horario', tone: 't-red', detail: `Partida ${ft}: para ${AIRPORTS[ap].short} se recomienda salir entre ${min / 60} y ${max / 60} h antes (cargado: ${r.time})`, f };
}

function availOk(d, r) {
  if (!d.days.includes(dow(r.date))) return false;
  const t = toMin(r.time); return t >= toMin(d.from) && t <= toMin(d.to);
}
function conflict(d, r) {
  const ts = resTs(r);
  return S.reservations.find(x => x.id !== r.id && x.driverId === d.id && ['Confirmada', 'En curso'].includes(x.status) && Math.abs(resTs(x) - ts) < RULES.marginH * 3600000);
}
// Evalúa a todos los conductores para una reserva y devuelve elegibles ordenados por ranking vigente
function evaluate(r) {
  return S.ranking.order.map(id => drv(id)).filter(Boolean).map(d => {
    const catOk = d.cats.includes(r.category);
    const capOk = r.pax <= (CAT_INFO[r.category]?.cap || 9);
    const av = availOk(d, r);
    const cf = conflict(d, r);
    const rejected = r.requests.some(q => q.driverId === d.id && q.status === 'Rechazada');
    const active = d.status === 'Activo';
    const reasons = [];
    if (!catOk) reasons.push('Categoría no habilitada'); if (!av) reasons.push('Sin disponibilidad registrada en ese horario');
    if (cf) reasons.push(`Viaje ${cf.id} a menos de ${RULES.marginH} h`); if (!active) reasons.push('Conductor inactivo');
    return { d, pos: rankPos(d.id), catOk, capOk, av, cf, rejected, eligible: catOk && av && !cf && active, reasons };
  });
}
const lastBatchReqs = r => r.requests.filter(q => q.batch === r.batch);

function sendBatch(r, auto, by = 'Equipo de reservas') {
  const ev = evaluate(r).filter(e => e.eligible && !e.rejected);

  const askedThisRound = id => r.requests.some(q => q.driverId === id && q.round === round);
  let cand = r.round ? ev.filter(e => !askedThisRound(e.d.id)) : ev;
  if (!r.round) round = 1;
  if (!cand.length && r.round) {
    if (round < RULES.rounds) { round++; cand = ev; if (cand.length) addHist(r, 'Segunda vuelta', 'Sin aceptación en la ronda 1. Se reenvía desde el principio del ranking (excepto quienes rechazaron)'); }
    else cand = [];
  }
  if (!cand.length) {
    r.noAcceptance = true; r.status = 'Pendiente de asignación';
    addHist(r, 'Alerta: sin aceptación tras dos vueltas', ev.length ? 'Contactar en forma manual a los choferes del registro de conductores periféricos' : 'No hay conductores elegibles disponibles. Contactar conductores periféricos', 'bad');
    return false;
  }
  const pick = cand.slice(0, RULES.batchSize);
  r.round = round; r.batch = (r.batch || 0) + 1; r.status = 'Consultando conductores'; r.noAcceptance = false;
  const t = now();
  pick.forEach(e => r.requests.push({ driverId: e.d.id, round, batch: r.batch, sentAt: t, status: 'Pendiente' }));
  addHist(r, 'Conductores consultados', `Ronda ${round} · grupo ${r.batch}${auto ? ' (envío automático)' : ''}: ${pick.map(e => e.d.name).join(', ')}`);
  if (!r.metrics.sentAt) r.metrics.sentAt = t;

}
function addHist(r, label, detail = '', kind = '') { r.history.push({ t: now(), label, detail, kind }); }

function maybeAdvance(r) {

  if (b.length && b.every(q => ['Rechazada', 'Vencida', 'Cerrada'].includes(q.status))) sendBatch(r, true);
}
function respond(resId, driverId, accept) {
  const r = resv(resId); if (!r) return;
  const q = r.requests.find(x => x.driverId === driverId && x.status === 'Pendiente'); if (!q) return;
  q.status = accept ? 'Aceptada' : 'Rechazada'; q.respondedAt = now();

    r.acceptedBy = driverId;
    r.requests.forEach(x => { if (x !== q && x.status === 'Pendiente') { x.status = 'Cerrada'; x.respondedAt = now(); } });
    r.metrics.aceptMin = Math.max(1, Math.round((q.respondedAt - q.sentAt) / 60000));
    r.metrics.firstBatch = q.batch === 1;
    addHist(r, 'Conductor aceptado', `${driverName(driverId)} aceptó desde la app. Pendiente de confirmación del equipo de reservas`, 'ok');
  } else {
    addHist(r, 'Respuesta de conductor', `${driverName(driverId)} rechazó la solicitud`, 'bad');

}
function confirmAssignment(r, manual = false, driverId = null, note = '') {
  const id = driverId || r.acceptedBy; if (!id) return;
  r.driverId = id; r.status = 'Confirmada'; r.noAcceptance = false; r.manual = manual;
  if (manual) {
    r.requests.forEach(x => { if (x.status === 'Pendiente') { x.status = 'Cerrada'; x.respondedAt = now(); } });
    r.requests.push({ driverId: id, round: r.round || 0, batch: (r.batch || 0) + 1, sentAt: now(), status: 'Aceptada', respondedAt: now(), manual: true });
    addHist(r, 'Asignación manual', `${driverName(id)} · ${note || 'contacto directo del equipo de reservas'}`);
  }
  r.acceptedBy = id;
  addHist(r, 'Servicio confirmado', `Confirmado por el equipo de reservas · ${driverName(id)}. Se incorpora a la agenda general y a la del conductor, se genera el registro administrativo y de liquidación (75/25)`, 'ok');
  r.serviceTrail = [{ s: 'Confirmado', t: now() }];

  const sent = r.metrics.sentAt || r.createdAt;

  </aside>
  ${U.side ? '<div class="scrim" data-a="side" style="z-index:25"></div>' : ''}
  <div class="main">

      <div class="clock" title="Reloj de simulación: avanza sólo con la app abierta">${ic('clock', 'sm')}<span class="lbl">Reloj demo</span><b data-clock>${fmtDT(now())}</b><button data-a="advance" title="Simula el paso de 20 minutos (vencimiento de solicitudes)">+20 min</button></div>
      <div style="position:relative"><button class="iconbtn" data-a="notif" aria-label="Notificaciones">${ic('bell')}${al.length ? `<span class="dot">${al.length}</span>` : ''}</button>${U.notif ? notifDD(al) : ''}</div>
      <div class="profile"><button data-a="prof"><span class="avatar ${S.role === 'gerencia' ? 'g' : ''}">${role.av}</span><span><div class="nm">${esc(role.user)}</div><div class="rl">${esc(role.label)}</div></span>${ic('down', 'sm')}</button>${U.prof ? profileDD() : ''}</div>

}
function noAccess(mod) {
  return `<div class="card"><div class="empty">${ic('shield', 'lg')}<h3 style="margin:8px 0 4px">El perfil ${esc(ROLES[S.role].label)} no tiene acceso a este módulo</h3><p>La visibilidad de cada pantalla depende del perfil activo.</p><a class="btn" href="#/inicio">Volver al inicio</a></div></div>`;
}
function searchResults() {
  const q = U.search.trim().toLowerCase();
  const rs = S.reservations.filter(r => r.id.toLowerCase().includes(q) || r.passenger.name.toLowerCase().includes(q) || (r.agency || '').toLowerCase().includes(q)).slice(0, 6);
  const ds = S.drivers.filter(d => d.name.toLowerCase().includes(q)).slice(0, 3);
  if (!rs.length && !ds.length) return `<div class="dd"><div class="empty" style="padding:18px">Sin resultados para "${esc(U.search)}"</div></div>`;
  return `<div class="dd">${rs.map(r => `<a class="it" href="#/reserva/${r.id}" data-a="closeSearch">${ic('clipboard', 'sm')}<div style="flex:1;min-width:0"><b class="mono">${r.id}</b> · ${esc(r.passenger.name)}<div class="muted" style="font-size:12px">${fmtD(r.date)} ${r.time} · ${esc(routeTxt(r))}</div></div>${stBadge(r)}</a>`).join('')}
  ${ds.map(d => `<a class="it" href="#/conductor/${d.id}" data-a="closeSearch">${ic('user', 'sm')}<div><b>${esc(d.name)}</b><div class="muted" style="font-size:12px">${d.cats.join(' · ')} · Ranking ${rankPos(d.id)}.º</div></div></a>`).join('')}</div>`;
}
function notifDD(al) {
  return `<div class="dd" style="width:380px"><div class="hd"><b style="color:var(--ink)">Alertas que requieren atención</b><span>${al.length}</span></div>
  ${al.length ? al.slice(0, 8).map(alertItem).join('') : '<div class="empty">Sin alertas</div>'}
  ${al.length > 8 ? `<a class="it" href="#/inicio" data-a="notif" style="justify-content:center">Ver todas en el inicio</a>` : ''}</div>`;
}
function alertItem(a) {
  return `<a class="alert-it it" href="${a.go}" style="color:inherit;text-decoration:none"><span class="ic ${a.lv}">${ic(a.ic, 'sm')}</span><span style="min-width:0"><div class="ttl">${esc(a.ttl)}</div><div class="dsc">${esc(a.dsc)}</div></span></a>`;
}
function profileDD() {
  return `<div class="dd" style="width:300px"><div class="hd"><b style="color:var(--ink)">Cambiar perfil de demostración</b></div>
  ${Object.entries(ROLES).map(([k, r]) => `<div class="it" data-a="role" data-v="${k}">${ic(k === 'conductor' ? 'phoneapp' : k === 'gerencia' ? 'chart' : 'clipboard', 'sm')}<div style="flex:1"><b>${r.label}</b><div class="muted" style="font-size:12px">${k === 'conductor' ? 'Vista móvil simplificada' : r.sub}</div></div>${S.role === k ? ic('check', 'sm') : ''}</div>`).join('')}
  <div class="hd" style="border:0;font-size:11.5px">Sin autenticación real: el selector sólo simula el perfil activo.</div></div>`;
}
function page(rt) {
  switch (rt.mod) {
    case 'inicio': return pDashboard();
    case 'reservas': return pReservas();
    case 'reserva': return pFicha(rt.id);
    case 'asignacion': return pAsignacion(rt.id);
    case 'calendario': return pCalendario();
    case 'conductores': return pConductores();
    case 'conductor': return pConductor(rt.id);
    case 'servicios': return pServicios(rt.id);
    case 'liquidaciones': return pLiquidaciones(rt.id);
    case 'administracion': return pAdministracion(rt.id);
    case 'indicadores': return pIndicadores();
    case 'configuracion': return pConfig();
  }
  return noAccess('inicio');
}
const ph = (title, desc, acts = '') => `<div class="ph"><div><h2>${title}</h2>${desc ? `<div class="desc">${desc}</div>` : ''}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;

// ---------- 1. Inicio / dashboard ----------
function pDashboard() {
  const p = U.dash; const [a, b, lbl] = period(p);
  const rs = S.reservations.filter(r => inP(r, p));
  const act = rs.filter(r => r.status !== 'Cancelada');
  const pendReq = rs.flatMap(r => r.requests.filter(q => q.status === 'Pendiente'));
  const conf = rs.filter(r => ASSIGNED.includes(r.status));
  const canc = rs.filter(r => r.status === 'Cancelada');
  const days = []; for (let d = a; d <= b; d = addDays(d, 1)) days.push(dow(d));
  const avail = S.drivers.filter(d => d.status === 'Activo' && d.days.some(x => days.includes(x)));
  const unassigned = rs.filter(r => r.status === 'Pendiente de asignación');
  const kpis = [
    ['Reservas del período', act.length, `${lbl} · sin canceladas`, 'clipboard', '#/reservas'],
    ['Pendientes de asignación', unassigned.length, unassigned.filter(r => r.noAcceptance).length ? `${unassigned.filter(r => r.noAcceptance).length} sin aceptación tras dos vueltas` : 'Sin conductor asignado', 'user', '#/asignacion'],
    ['Solicitudes sin respuesta', pendReq.length, `Ventana de ${RULES.responseMin} min por solicitud`, 'clock', '#/asignacion'],
    ['Servicios confirmados', conf.length, `${conf.filter(r => r.status === 'Finalizada').length} finalizados · ${conf.filter(r => r.status === 'En curso').length} en curso`, 'check', '#/servicios'],
    ['Servicios cancelados', canc.length, lbl, 'x', '#/reservas'],
    ['Conductores con disponibilidad', avail.length, `de ${S.drivers.length} registrados · disponibilidad declarada`, 'users', '#/conductores']
  ];
  const t0 = now();
  const upcoming = act.filter(r => r.status !== 'Finalizada' && resTs(r) + tripDur(r) * 60000 >= t0 - 3600000).sort((x, y) => resTs(x) - resTs(y));
  const list = (upcoming.length ? upcoming : act.slice().sort((x, y) => resTs(x) - resTs(y))).slice(0, 8);
  const al = alerts();
  // gráfico: semana en curso
  const ws = weekStart(today());
  const wk = [...Array(7)].map((_, i) => { const d = addDays(ws, i); return { d, n: S.reservations.filter(r => r.date === d && r.status !== 'Cancelada').length }; });
  const mx = Math.max(1, ...wk.map(x => x.n));
  const stCount = STATUSES.map(s => [s, rs.filter(r => r.status === s).length]).filter(x => x[1]);
  const mxs = Math.max(1, ...stCount.map(x => x[1]));
  return `${ph('Van al Aeropuerto | Panel de gestión', `${DOW[dow(today())]} ${fmtD(today())} · ${ROLES[S.role].label}`,
    `<div class="seg">${[['hoy', 'Hoy'], ['manana', 'Mañana'], ['semana', 'Semana en curso']].map(([k, l]) => `<button class="${p === k ? 'on' : ''}" data-a="set" data-k="dash" data-v="${k}">${l}</button>`).join('')}</div>${can.editRes() ? `<button class="btn pri" data-a="newRes">${ic('plus')}Nueva reserva</button>` : ''}`)}
  <div class="grid g6">${kpis.map(([k, v, s, i, go]) => `<a class="kpi" href="${go}" style="color:inherit;text-decoration:none"><span class="k">${ic(i, 'sm')}${k}</span><span class="v">${v}</span><span class="s">${esc(s)}</span></a>`).join('')}</div>
  <div class="grid split mt" style="grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)">
    <div class="card"><div class="card-h"><h3>Actividad operativa</h3><span class="sub">Próximos servicios · ${lbl.toLowerCase()}</span><a href="#/reservas" class="btn sm ghost" style="margin-left:auto">Ver reservas ${ic('right', 'sm')}</a></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Hora</th><th>Pasajero</th><th>Recorrido</th><th>Categoría</th><th>Conductor</th><th>Estado</th></tr></thead><tbody>
      ${list.length ? list.map(r => `<tr class="click" data-a="go" data-v="#/reserva/${r.id}"><td><b class="mono">${r.time}</b>${p !== 'hoy' ? `<div class="muted" style="font-size:11.5px">${fmtDs(r.date)}</div>` : ''}</td><td><div class="strong">${esc(r.passenger.name)}</div><div class="muted mono" style="font-size:11.5px">${r.id}${r.flight ? ' · ' + esc(r.flight) : ''}</div></td><td>${esc(routeTxt(r))}</td><td>${esc(r.category)}</td><td>${r.driverId ? esc(driverName(r.driverId)) : r.acceptedBy ? `<span class="muted">${esc(driverName(r.acceptedBy))} (a confirmar)</span>` : '<span class="muted">Sin asignar</span>'}</td><td>${stBadge(r)}</td></tr>`).join('') : `<tr><td colspan="6"><div class="empty">No hay servicios en el período</div></td></tr>`}
      </tbody></table></div></div>
    <div class="card"><div class="card-h"><h3>Alertas que requieren atención</h3><span class="badge t-red nodot" style="margin-left:auto">${al.length}</span></div>
      <div style="max-height:430px;overflow:auto">${al.length ? al.map(alertItem).join('') : '<div class="empty">Sin alertas pendientes</div>'}</div></div>
  </div>
  <div class="grid g2 mt">
    <div class="card"><div class="card-h"><h3>Reservas por día</h3><span class="sub">Semana en curso · sin canceladas</span></div><div class="card-b">
      <div class="bars" role="img" aria-label="Reservas por día de la semana en curso">${wk.map(x => `<div class="b" data-tip="${DOW[dow(x.d)]} ${fmtD(x.d)}: ${x.n} reservas"><span class="val">${x.n}</span><div class="bar" style="height:${(x.n / mx) * 82}%;${x.d === today() ? '' : 'background:#F7A672'}"></div></div>`).join('')}</div>
      <div class="bars-x">${wk.map(x => `<span style="${x.d === today() ? 'color:var(--brand-700);font-weight:600' : ''}">${DOW_S[dow(x.d)]} ${fmtDs(x.d)}</span>`).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h3>Distribución por estado</h3><span class="sub">${lbl} · ${rs.length} reservas</span></div><div class="card-b">
      ${stCount.length ? stCount.map(([s, n]) => `<div class="hbar" data-tip="${s}: ${n}"><span>${badge(s, ST_TONE[s])}</span><div class="trk"><div class="fill" style="width:${n / mxs * 100}%;background:${toneColor(ST_TONE[s])}"></div></div><span class="n">${n}</span></div>`).join('') : '<div class="empty">Sin reservas en el período</div>'}
    </div></div>
  </div>`;
}
const toneColor = t => ({ 't-blue': '#2F5FC4', 't-amber': '#C98A22', 't-red': '#CF3425', 't-orange': '#F26A1B', 't-green': '#1F8A47', 't-violet': '#6B4FBB', 't-dark': '#5A6372', 't-gray': '#98A1AE' }[t] || '#F26A1B');

// ---------- 2. Reservas ----------
function filteredRes() {
  const f = U.res, q = f.q.trim().toLowerCase();
  return S.reservations.filter(r =>
    (!q || r.id.toLowerCase().includes(q) || r.passenger.name.toLowerCase().includes(q) || (r.agency || '').toLowerCase().includes(q)) &&
    (f.date ? r.date === f.date : (f.scope !== 'prox' || r.date >= today())) && (!f.status || r.status === f.status) &&
    (!f.driver || (f.driver === '_none' ? !r.driverId : r.driverId === f.driver)) &&
    (!f.cat || r.category === f.cat) && (!f.client || r.clientType === f.client)
  ).sort((a, b) => resTs(a) - resTs(b));
}
function pReservas() {
  const f = U.res;
  const pendInbox = S.inbox.filter(i => i.status === 'Nueva consulta').length;
  const head = ph('Reservas', 'Registro centralizado: cada reserva se carga una sola vez en su ficha única.',
    can.editRes() ? `<button class="btn pri" data-a="newRes">${ic('plus')}Nueva reserva</button>` : `<span class="pill">${ic('shield', 'sm')}Sólo consulta para este perfil</span>`);
  const tabs = `<div class="tabs"><button class="${f.tab === 'list' ? 'on' : ''}" data-a="set" data-k="res.tab" data-v="list">${ic('list', 'sm')}Panel de reservas <span class="cnt">${S.reservations.length}</span></button><button class="${f.tab === 'bot' ? 'on' : ''}" data-a="set" data-k="res.tab" data-v="bot">${ic('bot', 'sm')}Bandeja Botmaker (simulada) <span class="cnt">${pendInbox}</span></button></div>`;
  if (f.tab === 'bot') return head + tabs + pInbox();
  const rows = filteredRes();
  const any = f.q || f.date || f.status || f.driver || f.cat || f.client;
  return `${head}${tabs}
  <div class="card"><div class="card-b" style="padding:12px 14px">
    <div class="filters">
      <div class="searchbox" style="width:260px;display:block">${ic('search', 'sm')}<input class="inp" id="rq" data-f="res.q" placeholder="Pasajero o código de reserva" value="${esc(f.q)}" style="padding-left:34px"></div>
      <input type="date" class="inp" id="rdate" data-f="res.date" value="${esc(f.date)}" aria-label="Fecha">
      <select class="inp" data-f="res.status" aria-label="Estado"><option value="">Todos los estados</option>${STATUSES.map(s => opt(s, f.status)).join('')}</select>
      <select class="inp" data-f="res.driver" aria-label="Conductor"><option value="">Todos los conductores</option>${opt('_none', f.driver, 'Sin conductor asignado')}${S.drivers.map(d => opt(d.id, f.driver, d.name)).join('')}</select>
      <select class="inp" data-f="res.cat" aria-label="Categoría"><option value="">Todas las categorías</option>${CATS.map(c => opt(c, f.cat)).join('')}</select>
      <select class="inp" data-f="res.client" aria-label="Tipo de cliente"><option value="">Particular y agencia</option>${opt('Particular', f.client)}${opt('Agencia', f.client)}</select>
      <div class="seg">${[['prox', 'Próximas'], ['all', 'Todas']].map(([k, l]) => `<button class="${f.scope === k && !f.date ? 'on' : ''}" data-a="scope" data-v="${k}">${l}</button>`).join('')}</div>
      <button class="btn sm ghost" data-a="dateShift" data-v="0">Hoy</button><button class="btn sm ghost" data-a="dateShift" data-v="1">Mañana</button>
      ${any ? `<button class="btn sm ghost" data-a="clearRes">${ic('x', 'sm')}Limpiar filtros</button>` : ''}
      <span class="muted" style="margin-left:auto;font-size:12.5px">${rows.length} resultado${rows.length === 1 ? '' : 's'}</span>
    </div></div>
    <div class="tbl-wrap" style="border-top:1px solid var(--line-2)"><table class="tbl"><thead><tr><th>Código</th><th>Fecha</th><th>Hora</th><th>Pasajero</th><th>Origen</th><th>Destino</th><th>Vuelo</th><th>Categoría</th><th>Conductor</th><th>Estado</th><th class="num">Acciones</th></tr></thead><tbody>
    ${rows.length ? rows.map(r => {
      const fc = flightCheck(r);
      return `<tr class="click" data-a="go" data-v="#/reserva/${r.id}"><td><b class="mono">${r.id}</b>${r.channel.startsWith('Botmaker') ? `<div title="Ingresó por Botmaker" class="muted" style="font-size:11px">${ic('bot', 'sm')} bot</div>` : ''}</td><td>${fmtD(r.date)}</td><td class="mono">${r.time}</td><td><div class="strong">${esc(r.passenger.name)}</div>${r.clientType === 'Agencia' ? `<div class="muted" style="font-size:11.5px">${esc(r.agency)}</div>` : ''}</td><td>${esc(shortPlace(r.origin))}</td><td>${esc(shortPlace(r.destination))}</td><td>${r.flight ? `<span class="mono">${esc(r.flight)}</span>${fc.k === 'rev' ? ` <span title="${esc(fc.detail)}" style="color:var(--red)">${ic('alert', 'sm')}</span>` : ''}` : '<span class="muted">—</span>'}</td><td>${esc(r.category)}</td><td>${r.driverId ? esc(driverName(r.driverId)) : '<span class="muted">—</span>'}</td><td>${stBadge(r)}</td>
      <td class="num" style="white-space:nowrap"><a class="btn sm ghost" href="#/reserva/${r.id}">Ficha</a>${can.editRes() && !['Finalizada', 'Cancelada'].includes(r.status) ? `<button class="btn sm ghost" data-a="editRes" data-v="${r.id}" title="Editar">${ic('edit', 'sm')}</button>` : ''}${can.assign() && r.status === 'Pendiente de asignación' ? `<a class="btn sm soft" href="#/asignacion/${r.id}">Asignar</a>` : ''}</td></tr>`;
    }).join('') : `<tr><td colspan="11"><div class="empty">No hay reservas que coincidan con los filtros.</div></td></tr>`}
    </tbody></table></div></div>`;
}
function pInbox() {
  const f = U.res;
  const items = S.inbox.filter(i => i.status === f.inbox).sort((a, b) => b.at - a.at);
  return `<div class="card mb"><div class="card-b">
    <div class="flowline">
      <div class="stp"><b>${ic('bot', 'sm')} Consulta en WhatsApp</b><span class="muted">El bot de Botmaker pide fecha, vuelo, origen, destino, pasajeros y equipaje</span></div><div class="ar">${ic('arrow')}</div>
      <div class="stp"><b>Capa de integración (API)</b><span class="muted">Los datos llegan a la bandeja única del sistema</span></div><div class="ar">${ic('arrow')}</div>

  </div></div>
  <div class="row mb"><div class="seg">${['Nueva consulta', 'Convertida', 'No concretada'].map(s => `<button class="${f.inbox === s ? 'on' : ''}" data-a="set" data-k="res.inbox" data-v="${s}">${s} (${S.inbox.filter(i => i.status === s).length})</button>`).join('')}</div></div>
  <div class="grid g3">${items.length ? items.map(i => `<div class="card"><div class="card-h"><span class="avatar">${initials(i.name)}</span><div><b>${esc(i.name)}</b><div class="sub">${esc(i.phone)} · ${fmtDT(i.at)}</div></div><span class="mono muted" style="margin-left:auto;font-size:11.5px">${i.id}</span></div>
    <div class="card-b"><div style="background:#F4F6F3;border-radius:10px;padding:10px 12px;font-size:13px">${esc(i.msg)}</div>
    ${i.status === 'Nueva consulta' ? `<div class="kv mt" style="grid-template-columns:1fr 1fr">${[['Fecha', i.data.date ? fmtD(i.data.date) : 'Sin dato'], ['Hora', i.data.time || 'Sin dato'], ['Vuelo', i.data.flight || 'Sin dato'], ['Pasajeros', i.data.pax], ['Origen', shortPlace(i.data.origin)], ['Destino', shortPlace(i.data.destination)]].map(([l, v]) => `<div class="f"><div class="l">${l}</div><div class="v" style="${v === 'Sin dato' ? 'color:var(--amber)' : ''}">${esc(v)}</div></div>`).join('')}</div>
    <div class="row mt">${can.editRes() ? `<button class="btn pri sm" data-a="fromBot" data-v="${i.id}">${ic('check', 'sm')}Revisar y crear reserva</button><button class="btn sm ghost" data-a="discardBot" data-v="${i.id}">Marcar no concretada</button>` : '<span class="muted" style="font-size:12px">Sólo el equipo de reservas convierte consultas.</span>'}</div>`
      : i.reservationId ? `<div class="mt-s"><a href="#/reserva/${i.reservationId}">${ic('link', 'sm')} Reserva ${i.reservationId}</a></div>` : ''}
    </div></div>`).join('') : '<div class="card"><div class="empty">No hay consultas en este estado.</div></div>'}</div>`;
}

// ---------- 3. Ficha única ----------
function pFicha(id) {
  const r = resv(id);
  if (!r) return `<div class="card"><div class="empty">No existe la reserva ${esc(id)}. <a href="#/reservas">Volver a reservas</a></div></div>`;
  const fc = flightCheck(r);
  const f = (l, v, cls = '') => `<div class="f ${cls}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  const editable = can.editRes() && !['Finalizada', 'Cancelada'].includes(r.status);
  const acts = [
    `<a class="btn" href="#/reservas">${ic('left', 'sm')}Reservas</a>`,
    editable ? `<button class="btn" data-a="editRes" data-v="${r.id}">${ic('edit', 'sm')}Editar</button>` : '',
    editable && ['Nueva', 'Pendiente de revisión'].includes(r.status) ? `<button class="btn soft" data-a="markReviewed" data-v="${r.id}">${ic('check', 'sm')}Marcar información revisada</button>` : '',

    editable ? `<button class="btn danger" data-a="cancelRes" data-v="${r.id}">Cancelar reserva</button>` : ''
  ].join('');
  // eventos estándar del ciclo (los posteriores aparecen sólo cuando corresponden)
  const std = ['Consulta recibida', 'Reserva registrada', 'Información revisada', 'Conductores consultados', 'Conductor aceptado', 'Servicio confirmado', 'Viaje realizado', 'Servicio finalizado'];
  const reached = new Set(r.history.map(h => h.label));
  const nextStd = r.status === 'Cancelada' ? null : std.find(s => !reached.has(s));
  const ev = evaluate(r);
  const reqRows = r.requests.slice().sort((a, b) => a.batch - b.batch || rankPos(a.driverId) - rankPos(b.driverId));
  const svc = svcStatus(r);
  return `${ph(`<span class="mono">Servicio ${r.id}</span> ${stBadge(r)}`, `${esc(r.passenger.name)} · ${fmtD(r.date)} ${r.time} · ${esc(routeTxt(r))}`, acts)}
  ${r.noAcceptance ? `<div class="banner err mb">${ic('alert')}<span><b>Sin aceptación tras dos vueltas.</b> Contactar en forma manual a los choferes del registro de conductores periféricos.</span></div>` : ''}
  ${r.status === 'Cancelada' ? `<div class="banner err mb">${ic('x')}<span><b>Reserva cancelada.</b> ${esc(r.cancelReason || '')}</span></div>` : ''}
  <div class="grid split" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start">
   <div class="stack">
    <section class="blk"><div class="blk-h"><span class="n">1</span>Identificación</div><div class="blk-b"><div class="kv">
      ${f('Código del servicio', `<span class="mono">${r.id}</span>`)}${f('Estado actual', stBadge(r))}${f('Fecha de creación', fmtDT(r.createdAt))}${f('Canal de origen', `${r.channel.startsWith('Botmaker') ? ic('bot', 'sm') + ' ' : ''}${esc(r.channel)}`)}
    </div></div></section>
    <section class="blk"><div class="blk-h"><span class="n">2</span>Pasajero${r.channel.startsWith('Botmaker') ? '<span class="pill" style="margin-left:auto">importado del bot</span>' : ''}</div><div class="blk-b"><div class="kv">
      ${f('Nombre', esc(r.passenger.name))}${f('Teléfono', `${ic('phone', 'sm')} ${esc(r.passenger.phone)}`)}${f('Correo electrónico', r.passenger.email ? esc(r.passenger.email) : '<span class="muted">No informado</span>')}${f('Tipo de cliente', esc(r.clientType) + (r.agency ? ` · ${esc(r.agency)}` : ''))}
    </div></div></section>
    <section class="blk"><div class="blk-h"><span class="n">3</span>Información del viaje<span style="margin-left:auto">${badge(fc.label, fc.tone)}</span></div><div class="blk-b">
      <div class="kv c3">${f('Fecha', fmtD(r.date))}${f('Hora (24 h)', `<span class="mono">${r.time}</span>`)}${f('Número de vuelo', r.flight ? `<span class="mono">${esc(r.flight)}</span>` : '<span class="muted">—</span>')}
      ${f('Origen', esc(r.origin), '')}${f('Destino', esc(r.destination))}${f('Aeropuerto', esc(AIRPORTS[r.airport].label))}
      ${f('Pasajeros', r.pax)}${f('Equipaje', `${r.luggage} · ${esc(r.luggageType)}`)}${f('Categoría del vehículo', esc(r.category))}
      ${f('Equipamiento especial', r.equipment ? esc(r.equipment) : '<span class="muted">Ninguno</span>', 'full')}</div>
      <div class="banner ${fc.k === 'ok' ? 'ok' : fc.k === 'rev' ? 'err' : fc.k === 'pend' ? 'warn' : 'info'} mt">${ic(fc.k === 'ok' ? 'check' : fc.k === 'na' ? 'info' : 'plane')}<span><b>Validación del horario: ${esc(fc.label)}.</b> ${esc(fc.detail)}.<br><span style="font-size:12px;opacity:.85">Simulación local con vuelos ilustrativos; no consulta a aerolíneas.</span></span></div>
    </div></section>
    <section class="blk"><div class="blk-h"><span class="n">4</span>Información comercial</div><div class="blk-b"><div class="kv">
      ${f('Precio', `<b>${money(r.price)}</b> <span class="muted" style="font-size:12px">tarifa fija ${esc(r.category)}</span>`)}${f('Estado del pago', badge(r.payment, r.payment === 'Pagado' ? 't-green' : r.payment === 'Cuenta corriente' ? 't-blue' : 't-amber'))}
      ${f('Condiciones particulares', r.conditions ? esc(r.conditions) : '<span class="muted">—</span>')}${f('Observaciones', r.notes ? esc(r.notes) : '<span class="muted">—</span>')}
    </div></div></section>
   </div>
   <div class="stack">
    <section class="blk"><div class="blk-h"><span class="n">5</span>Asignación<span class="muted" style="margin-left:auto;font-weight:400;font-size:12px">Ranking vigente · semana del ${fmtDs(S.ranking.week)}</span></div><div class="blk-b">
      ${r.driverId ? `<div class="dcard ok"><span class="rank">${rankPos(r.driverId)}<small>rank</small></span><div style="flex:1"><b>${esc(driverName(r.driverId))}</b>${r.manual ? ' <span class="pill">asignación manual</span>' : ''}<div class="muted" style="font-size:12.5px">${esc(drv(r.driverId).vehicle)} · ${esc(drv(r.driverId).phone)}</div></div>${badge('Asignado', 't-green')}</div>` :
        r.acceptedBy ? `<div class="banner ok">${ic('check')}<span><b>${esc(driverName(r.acceptedBy))} aceptó el viaje.</b> El equipo de reservas debe confirmar la asignación.</span></div>` : ''}
      ${reqRows.length ? `<div class="tbl-wrap mt-s"><table class="tbl"><thead><tr><th>Conductor</th><th>Rank</th><th>Ronda</th><th>Envío</th><th>Respuesta</th></tr></thead><tbody>${reqRows.map(q => `<tr><td>${esc(driverName(q.driverId))}</td><td>${rankPos(q.driverId)}.º</td><td>${q.round}·${q.batch}</td><td class="mono" style="font-size:12px">${fmtT(q.sentAt)}</td><td>${badge(q.status, REQ_TONE[q.status])}${q.status === 'Pendiente' ? ` <span class="countdown" data-cd="${q.sentAt}"></span>` : q.respondedAt ? ` <span class="muted mono" style="font-size:11.5px">${fmtT(q.respondedAt)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`
        : !r.driverId ? `<div class="muted" style="font-size:13px">Todavía no se enviaron solicitudes.</div>` : ''}
      ${!r.driverId && !['Cancelada'].includes(r.status) ? `<div class="lbl mt">Conductores elegibles (según categoría, disponibilidad registrada y margen de ${RULES.marginH} h)</div>
        <div class="chips mt-s">${ev.filter(e => e.eligible).map(e => `<span class="tag">${e.pos}.º ${esc(e.d.name)}${e.rejected ? ' · rechazó' : ''}</span>`).join('') || '<span class="muted">Ninguno elegible</span>'}</div>` : ''}
      ${can.assign() && ['Pendiente de asignación', 'Consultando conductores'].includes(r.status) ? `<a class="btn soft sm mt" href="#/asignacion/${r.id}">${ic('send', 'sm')}Ir al módulo de asignación</a>` : ''}
    </div></section>
    <section class="blk"><div class="blk-h">${ic('refresh', 'sm')}Se genera solo al confirmar</div><div class="blk-b">
      ${[['Agenda general y del conductor', ASSIGNED.includes(r.status), `#/calendario`], ['Registro administrativo (sin volver a transcribir)', ASSIGNED.includes(r.status), '#/administracion'], [`Liquidación ${RULES.driverPct}/${RULES.companyPct}: ${r.driverId ? money(r.price * .75) + ' conductor · ' + money(r.price * .25) + ' empresa' : 'pendiente'}`, ASSIGNED.includes(r.status), '#/liquidaciones'], ['Aviso al pasajero con datos del conductor (simulado)', ASSIGNED.includes(r.status), null]].map(([t, ok]) => `<div class="row" style="padding:5px 0;font-size:13px">${ok ? `<span style="color:var(--green)">${ic('check', 'sm')}</span>` : `<span class="muted">${ic('clock', 'sm')}</span>`}<span class="${ok ? '' : 'muted'}">${t}</span></div>`).join('')}
      <div class="hint mt-s">La automatización no reemplaza la revisión humana: el equipo de reservas confirma cada asignación.</div>
    </div></section>
    ${ASSIGNED.includes(r.status) ? `<section class="blk"><div class="blk-h">${ic('activity', 'sm')}Seguimiento del servicio<a href="#/servicios/${r.id}" class="btn sm ghost" style="margin-left:auto">Abrir ${ic('right', 'sm')}</a></div><div class="blk-b">${stepper(r)}
      ${r.incidents.length ? `<div class="lbl mt">Incidencias</div>${r.incidents.map(i => `<div class="banner ${i.resolved ? 'info' : 'err'} mt-s">${ic('alert')}<span><b>${fmtDT(i.t)}</b> · ${esc(i.by)}<br>${esc(i.text)} ${i.resolved ? '<i>(resuelta)</i>' : ''}</span></div>`).join('')}` : ''}</div></section>` : ''}
    <section class="blk"><div class="blk-h"><span class="n">6</span>Historial del servicio</div><div class="blk-b"><ul class="timeline">
      ${r.history.map(h => `<li><span class="dt ${h.kind === 'ok' ? 'g' : h.kind === 'bad' ? 'r' : ''}"></span><div class="tt">${esc(h.label)}</div><div class="ts">${fmtDT(h.t)}</div>${h.detail ? `<div class="td">${esc(h.detail)}</div>` : ''}</li>`).join('')}
      ${nextStd ? `<li class="future"><span class="dt p"></span><div class="tt">Próximo paso: ${esc(nextStd)}</div></li>` : ''}
    </ul></div></section>
   </div>
  </div>`;
}
function stepper(r) {
  const trail = r.serviceTrail; const cur = svcStatus(r);
  const idx = SVC.indexOf(cur);
  return `<div class="steps">${SVC.map((s, i) => { const t = trail.find(x => x.s === s); const cls = i < idx || (i === idx && s === 'Finalizado') ? 'done' : i === idx ? 'cur' : ''; return `<div class="st ${cls}"><span class="c">${i <= idx ? ic('check', 'sm') : ''}</span>${s}${t ? `<span class="tm">${fmtT(t.t)}</span>` : ''}</div>`; }).join('')}</div>`;
}

// ---------- 4. Asignación ----------
function pAsignacion(id) {
  const pend = S.reservations.filter(r => r.status === 'Pendiente de asignación' || r.status === 'Consultando conductores').sort((a, b) => resTs(a) - resTs(b));
  const sel = id ? resv(id) : pend[0];
  const list = `<div class="card"><div class="card-h"><h3>Reservas que requieren asignación</h3><span class="badge t-gray nodot" style="margin-left:auto">${pend.length}</span></div>
  <div style="max-height:calc(100vh - 230px);overflow:auto">${pend.length ? pend.map(r => {
    const first = r.requests.length ? Math.min(...r.requests.map(q => q.sentAt)) : null;
    return `<a href="#/asignacion/${r.id}" style="display:block;padding:12px 14px;border-bottom:1px solid var(--line-2);color:inherit;text-decoration:none;${sel && sel.id === r.id ? 'background:var(--brand-50);box-shadow:inset 3px 0 0 var(--brand)' : ''}">
      <div class="row between"><b class="mono">${fmtDs(r.date)} · ${r.time}</b>${stBadge(r)}</div>
      <div style="font-weight:600;margin-top:3px">${esc(routeTxt(r))}</div>
      <div class="muted" style="font-size:12.5px">${esc(r.category)} · ${r.pax} pax · ${r.luggage} valijas${r.childSeats ? ` · ${r.childSeats} butaca${r.childSeats > 1 ? 's' : ''}` : ''}</div>
      <div class="muted" style="font-size:12px;margin-top:3px">${ic('clock', 'sm')} ${first ? `Proceso iniciado hace ${Math.max(0, Math.round((now() - first) / 60000))} min` : 'Sin iniciar'} · <span class="mono">${r.id}</span></div></a>`;
  }).join('') : '<div class="empty">No hay reservas pendientes de asignación.</div>'}</div></div>`;
  return `${ph('Asignación de conductores', `Regla del MVP: solicitudes a grupos de hasta ${RULES.batchSize} conductores según el ranking vigente, ${RULES.responseMin} minutos para responder y ${RULES.rounds} vueltas antes de la alerta.`,
    `<button class="btn" data-a="advance">${ic('clock', 'sm')}Simular +20 min</button>`)}
  <div class="grid split" style="grid-template-columns:minmax(280px,360px) minmax(0,1fr);align-items:start">${list}<div>${sel ? assignPanel(sel) : '<div class="card"><div class="empty">Seleccioná una reserva.</div></div>'}</div></div>`;
}
function assignPanel(r) {
  const ev = evaluate(r);
  const el = ev.filter(e => e.eligible), notEl = ev.filter(e => !e.eligible);
  const reqOf = id => r.requests.filter(q => q.driverId === id).sort((a, b) => b.batch - a.batch)[0];
  const pending = r.requests.filter(q => q.status === 'Pendiente');
  const canAct = can.assign() && ['Pendiente de asignación', 'Consultando conductores'].includes(r.status);
  const accepted = r.acceptedBy && r.status === 'Consultando conductores';
  const cf = accepted ? conflict(drv(r.acceptedBy), r) : null;
  const nextPick = el.filter(e => !e.rejected).slice(0, RULES.batchSize);
  const fc = flightCheck(r);
  let action = '';
  if (!canAct) action = `<div class="banner info">${ic('info')}<span>${['Confirmada', 'En curso', 'Finalizada'].includes(r.status) ? `Asignación confirmada con ${esc(driverName(r.driverId))}.` : r.status === 'Cancelada' ? 'Reserva cancelada.' : 'El perfil activo sólo puede consultar la asignación.'}</span></div>`;
  else if (accepted) action = `<div class="banner ok">${ic('check')}<span><b>${esc(driverName(r.acceptedBy))} aceptó la solicitud</b> a las ${fmtT(r.requests.find(q => q.status === 'Aceptada' && q.driverId === r.acceptedBy).respondedAt)}. Revisá la propuesta y confirmá la asignación.</span></div>
    ${cf ? `<div class="banner err mt-s">${ic('alert')}<span>Conflicto: el conductor ya tiene confirmado ${cf.id} a menos de ${RULES.marginH} h. No se puede confirmar; podés descartar la aceptación y continuar con el siguiente grupo.</span></div>` : ''}
    <div class="row mt"><button class="btn ok" data-a="confirmAssign" data-v="${r.id}" ${cf ? 'disabled' : ''}>${ic('check', 'sm')}Confirmar asignación a ${esc(firstName(driverName(r.acceptedBy)))}</button><button class="btn" data-a="dropAccept" data-v="${r.id}">Descartar y seguir con el ranking</button></div>`;
  else if (r.noAcceptance) action = `<div class="banner err">${ic('alert')}<span><b>Sin aceptación tras ${RULES.rounds} vueltas.</b> El equipo debe contactar en forma manual a los choferes del registro de conductores periféricos y registrar la asignación.</span></div>
    <div class="row mt"><button class="btn pri" data-a="manualAssign" data-v="${r.id}">${ic('phone', 'sm')}Registrar asignación manual</button></div>`;
  else if (r.status === 'Consultando conductores') action = `<div class="banner brand">${ic('clock')}<span><b>Ronda ${r.round} · grupo ${r.batch}:</b> ${pending.length} solicitud${pending.length === 1 ? '' : 'es'} pendiente${pending.length === 1 ? '' : 's'}. Si nadie acepta, el sistema envía automáticamente al grupo siguiente. ${pending.length ? `<span class="countdown" data-cd="${Math.min(...pending.map(q => q.sentAt))}"></span>` : ''}</span></div>
    <div class="row mt wrap">${pending.map(q => `<button class="btn sm" data-a="asDriver" data-v="${q.driverId}">${ic('phoneapp', 'sm')}Abrir app de ${esc(firstName(driverName(q.driverId)))}</button>`).join('')}<button class="btn sm ghost" data-a="advance">${ic('clock', 'sm')}Simular +20 min</button></div>`;
  else action = `<div class="banner info">${ic('info')}<span>Propuesta del sistema: enviar la solicitud a ${nextPick.length ? nextPick.map(e => `<b>${esc(e.d.name)}</b> (${e.pos}.º)`).join(', ') : 'ningún conductor elegible'}. ${fc.k === 'rev' || fc.k === 'pend' ? `<br><b>Atención:</b> ${esc(fc.label)} — ${esc(fc.detail)}.` : ''}</span></div>
    <div class="row mt"><button class="btn pri" data-a="sendReq" data-v="${r.id}" ${nextPick.length ? '' : 'disabled'}>${ic('send', 'sm')}Revisar y enviar solicitudes</button>${!nextPick.length ? `<button class="btn" data-a="manualAssign" data-v="${r.id}">${ic('phone', 'sm')}Asignación manual</button>` : ''}</div>`;
  const card = e => {
    const q = reqOf(e.d.id);
    const st = q ? q.status : (e.rejected ? 'Rechazada' : null);
    const isNext = !q && !r.requests.length && nextPick.some(n => n.d.id === e.d.id);
    return `<div class="dcard ${q && q.status === 'Aceptada' ? 'ok' : isNext || (q && q.status === 'Pendiente') ? 'best' : ''}">
      <span class="rank">${e.pos}<small>rank</small></span>
      <div style="flex:1;min-width:0"><div class="row between wrap"><b>${esc(e.d.name)}</b>${st ? badge(st === 'Pendiente' ? 'Solicitud pendiente' : st, REQ_TONE[st]) : isNext ? badge('Propuesto', 't-orange') : badge('Sin solicitud', 't-gray')}</div>
      <div class="muted" style="font-size:12.5px">${esc(e.d.vehicle)}</div>
      <div class="chips mt-s"><span class="ck">${ic('check', 'sm')}${esc(r.category)}</span><span class="ck ${e.capOk ? '' : 'no'}">${ic(e.capOk ? 'check' : 'x', 'sm')}${r.pax} pax</span><span class="ck">${ic('calendar', 'sm')}Disp. ${DOW_S.filter((_, i) => e.d.days.includes(i)).join(' ')} ${e.d.from}–${e.d.to}</span><span class="ck">${ic('check', 'sm')}Margen ${RULES.marginH} h</span>${r.notes.toLowerCase().includes('inglés') ? `<span class="ck ${e.d.english ? '' : 'no'}">Inglés</span>` : ''}</div>
      ${q ? `<div class="muted" style="font-size:12px;margin-top:6px">Enviada ${fmtT(q.sentAt)} · ronda ${q.round}${q.respondedAt ? ` · respuesta ${fmtT(q.respondedAt)}` : ''} ${q.status === 'Pendiente' ? `· <span class="countdown" data-cd="${q.sentAt}"></span>` : ''}</div>` : ''}
      <div class="hint" style="margin-top:4px">Solicitudes pendientes de este conductor: ${S.reservations.reduce((n, x) => n + x.requests.filter(y => y.driverId === e.d.id && y.status === 'Pendiente').length, 0)}</div></div></div>`;
  };
  return `<div class="card"><div class="card-h"><div><h3><span class="mono">${r.id}</span> · ${esc(r.passenger.name)}</h3><div class="sub">${fmtD(r.date)} ${r.time} · ${esc(r.origin)} → ${esc(r.destination)}</div></div><a href="#/reserva/${r.id}" class="btn sm" style="margin-left:auto">Ver ficha</a></div>
    <div class="card-b"><div class="kv c3" style="margin-bottom:14px">${[['Categoría', r.category], ['Pasajeros', r.pax], ['Equipaje', `${r.luggage} · ${r.luggageType}`], ['Vuelo', r.flight || '—'], ['Validación', fc.label], ['Equipamiento', r.equipment || 'Ninguno']].map(([l, v]) => `<div class="f"><div class="l">${l}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>${action}</div></div>
  <div class="card mt"><div class="card-h"><h3>Conductores elegibles</h3><span class="sub">Ordenados por ranking vigente · ${el.length} de ${ev.length}</span></div><div class="card-b stack-s">
    <div class="banner warn" style="font-size:12.5px">${ic('info', 'sm')}<span>La disponibilidad es la que registró cada conductor: sirve como criterio operativo, no garantiza que pueda tomar el viaje. Por eso se le pide confirmación.</span></div>
    ${el.length ? el.map(card).join('') : '<div class="empty">No hay conductores elegibles para esta reserva.</div>'}
    ${notEl.length ? `<details class="mt"><summary style="cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)">No elegibles (${notEl.length})</summary><div class="stack-s mt-s">${notEl.map(e => `<div class="dcard" style="opacity:.75"><span class="rank" style="background:var(--gray-50);color:var(--muted)">${e.pos}</span><div><b>${esc(e.d.name)}</b><div class="muted" style="font-size:12px">${e.d.cats.join(' · ')}</div><div class="chips mt-s">${e.reasons.map(x => `<span class="ck no">${ic('x', 'sm')}${esc(x)}</span>`).join('')}</div></div></div>`).join('')}</div></details>` : ''}
  </div></div>`;
}

// ---------- 5. Calendario ----------
function calEvents(from, to) {
  const c = U.cal;
  return S.reservations.filter(r => r.date >= from && r.date <= to &&
    (ASSIGNED.includes(r.status) || (c.pend && ['Pendiente de asignación', 'Consultando conductores', 'Nueva', 'Pendiente de revisión'].includes(r.status))) &&
    (!c.driver || r.driverId === c.driver) && (!c.cat || r.category === c.cat) && (!c.status || r.status === c.status)
  ).sort((a, b) => resTs(a) - resTs(b));
}
const evCls = r => r.status === 'Finalizada' ? 's-fin' : r.status === 'En curso' ? 's-curso' : r.status === 'Confirmada' ? 's-conf' : r.status === 'Cancelada' ? 's-canc' : 's-pend';
function pCalendario() {
  const c = U.cal; if (!c.date) c.date = today();
  let from, to, title;
  if (c.view === 'day') { from = to = c.date; title = `${DOW[dow(c.date)]} ${fmtD(c.date)}`; }
  else if (c.view === 'week') { from = weekStart(c.date); to = addDays(from, 6); title = `Semana del ${weekLabel(from)}`; }
  else { const d = parseISO(c.date); from = isoDate(new Date(d.getFullYear(), d.getMonth(), 1)); to = isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 0)); title = `${MONTHS[d.getMonth()][0].toUpperCase() + MONTHS[d.getMonth()].slice(1)} ${d.getFullYear()}`; }
  const head = `${ph('Calendario operativo', 'Agenda general compartida. Los viajes aparecen al confirmarse la asignación; una solicitud rechazada no se registra como viaje.')}
  <div class="card mb"><div class="card-b" style="padding:12px 14px"><div class="filters">
    <div class="seg">${[['day', 'Día'], ['week', 'Semana'], ['month', 'Mes']].map(([k, l]) => `<button class="${c.view === k ? 'on' : ''}" data-a="set" data-k="cal.view" data-v="${k}">${l}</button>`).join('')}</div>
    <button class="iconbtn" data-a="calNav" data-v="-1" aria-label="Anterior">${ic('left')}</button><button class="btn sm" data-a="calNav" data-v="0">Hoy</button><button class="iconbtn" data-a="calNav" data-v="1" aria-label="Siguiente">${ic('right')}</button>
    <b style="font-size:15px;margin:0 6px">${title}</b>
    <span style="flex:1"></span>
    <select class="inp" data-f="cal.driver" aria-label="Conductor"><option value="">Todos los conductores</option>${S.drivers.map(d => opt(d.id, c.driver, d.name)).join('')}</select>
    <select class="inp" data-f="cal.cat" aria-label="Categoría"><option value="">Todas las categorías</option>${CATS.map(x => opt(x, c.cat)).join('')}</select>
    <select class="inp" data-f="cal.status" aria-label="Estado"><option value="">Todos los estados</option>${['Confirmada', 'En curso', 'Finalizada', 'Pendiente de asignación', 'Consultando conductores'].map(x => opt(x, c.status)).join('')}</select>
    <label class="chk"><input type="checkbox" data-f="cal.pend" ${c.pend ? 'checked' : ''}>Mostrar sin confirmar</label>
  </div></div></div>
  <div class="legend mb"><span><i style="background:#F7FCF9;border-color:var(--green)"></i>Confirmado</span><span><i style="background:#F6F9FE;border-color:var(--blue)"></i>En curso</span><span><i style="background:#FAFAFB;border-color:#8B93A1"></i>Finalizado</span><span><i style="background:#FFFBF8;border-color:var(--brand);border-style:dashed"></i>Sin confirmar (no es viaje)</span>${c.view === 'day' ? '<span><i style="background:#ECF4EE;border-color:#CBE0D1;border-style:dashed"></i>Disponibilidad registrada</span>' : ''}</div>`;
  const evs = calEvents(from, to);
  if (c.view === 'week') {
    return head + `<div class="cal-week">${[...Array(7)].map((_, i) => { const d = addDays(from, i); const de = evs.filter(r => r.date === d); return `<div class="col ${d === today() ? 'today' : ''}"><div class="dh" data-a="calDay" data-v="${d}"><span>${DOW_S[dow(d)]}</span><b>${parseISO(d).getDate()}</b></div><div class="evs">${de.map(evBox).join('') || '<div class="muted" style="font-size:12px;padding:6px">Sin viajes</div>'}</div></div>`; }).join('')}</div>`;
  }
  if (c.view === 'month') {
    const start = weekStart(from); const cells = [];
    for (let d = start; d <= to || cells.length % 7; d = addDays(d, 1)) cells.push(d);
    return head + `<div class="cal-month">${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(x => `<div class="wd">${x}</div>`).join('')}${cells.map(d => { const de = evs.filter(r => r.date === d); return `<div class="cell ${d < from || d > to ? 'out' : ''} ${d === today() ? 'today' : ''}"><span class="n" data-a="calDay" data-v="${d}">${parseISO(d).getDate()}</span>${de.slice(0, 3).map(r => `<div class="mini-ev ${evCls(r)}" data-a="go" data-v="#/reserva/${r.id}" title="${esc(r.time + ' ' + r.passenger.name + ' · ' + routeTxt(r))}"><b>${r.time}</b> ${esc(r.passenger.name.startsWith('Familia') || r.passenger.name.startsWith('Grupo') ? r.passenger.name : r.passenger.name.split(' ').slice(-1)[0])}</div>`).join('')}${de.length > 3 ? `<span class="muted" style="font-size:11px;cursor:pointer" data-a="calDay" data-v="${d}">+${de.length - 3} más</span>` : ''}</div>`; }).join('')}</div>`;
  }
  // vista diaria por conductor
  const H0 = 4, H1 = 24, span = (H1 - H0) * 60;
  const x = m => `${Math.max(0, Math.min(100, (m - H0 * 60) / span * 100))}%`;
  const drivers = S.drivers.filter(d => (!c.driver || d.id === c.driver) && (!c.cat || d.cats.includes(c.cat)));
  const unas = evs.filter(r => !r.driverId);
  const nowM = c.date === today() ? (new Date(now()).getHours() * 60 + new Date(now()).getMinutes()) : null;
  const lane = (who, list, d) => `<div class="lane"><div class="who">${who}</div><div class="track">
    ${d && d.days.includes(dow(c.date)) ? `<div class="av" style="left:${x(toMin(d.from))};width:calc(${x(toMin(d.to))} - ${x(toMin(d.from))})" title="Disponibilidad registrada ${d.from}–${d.to}"></div>` : ''}
    ${list.map(r => `<div class="ev ${evCls(r)}" data-a="go" data-v="#/reserva/${r.id}" style="left:${x(toMin(r.time))};width:calc(${x(toMin(r.time) + tripDur(r))} - ${x(toMin(r.time))})" title="${esc(`${r.time} · ${r.passenger.name} · ${routeTxt(r)} · ${r.status}`)}"><span class="h">${r.time}</span> ${esc(r.passenger.name)}<div class="r">${esc(routeTxt(r))}</div></div>`).join('')}
    ${nowM !== null ? `<div class="now" style="left:${x(nowM)}"></div>` : ''}</div></div>`;
  return head + `<div class="cal-day"><div class="inner">
    <div class="hrs"><div class="who" style="padding:7px 12px;font-size:12px;color:var(--muted)">Conductor</div><div class="scale">${[...Array(H1 - H0 + 1)].map((_, i) => i % 2 === 0 ? `<span style="left:${i / (H1 - H0) * 100}%">${pad(H0 + i)}:00</span>` : '').join('')}</div></div>
    ${c.pend && unas.length ? lane(`<b style="color:var(--brand-700)">Sin conductor</b><span class="muted">${unas.length} pendiente${unas.length > 1 ? 's' : ''}</span>`, unas, null) : ''}
    ${drivers.map(d => lane(`<b>${esc(d.name)}</b><span class="muted">${d.cats.join(' · ')}</span>`, evs.filter(r => r.driverId === d.id), d)).join('')}
  </div></div>`;
}
function evBox(r) {
  return `<div class="ev ${evCls(r)}" data-a="go" data-v="#/reserva/${r.id}" title="Abrir ficha ${r.id}"><div class="h">${r.time}</div><div class="p">${esc(r.passenger.name)}</div><div class="r">${esc(routeTxt(r))}</div><div class="d">${r.driverId ? esc(driverName(r.driverId)) : r.acceptedBy ? 'Aceptado · a confirmar' : esc(r.status)}</div></div>`;
}

// ---------- 7. Servicios y seguimiento ----------
function pServicios(id) {
  const f = U.svc;
  const list = S.reservations.filter(r => ASSIGNED.includes(r.status) && inP(r, f.period) && (!f.driver || r.driverId === f.driver) && (!f.status || (f.status === 'Incidencia' ? r.incidents.some(i => !i.resolved) : svcStatus(r) === f.status))).sort((a, b) => resTs(a) - resTs(b));
  const sel = id ? resv(id) : list.find(r => r.status === 'En curso') || list[0];
  const incidents = S.reservations.flatMap(r => r.incidents.map(i => ({ ...i, r }))).sort((a, b) => b.t - a.t);
  return `${ph('Servicios y seguimiento', 'Ciclo de vida de los servicios confirmados. El conductor actualiza el estado desde su app y el panel lo refleja.',
    can.incident() ? `<button class="btn" data-a="newIncident" data-v="${sel ? sel.id : ''}">${ic('alert', 'sm')}Registrar incidencia</button>` : '')}
  <div class="card mb"><div class="card-b" style="padding:12px 14px"><div class="filters">
    <select class="inp" data-f="svc.period">${[['hoy', 'Hoy'], ['manana', 'Mañana'], ['semana', 'Semana en curso'], ['anterior', 'Semana anterior'], ['todo', 'Todas las fechas']].map(([k, l]) => opt(k, f.period, l)).join('')}</select>
    <select class="inp" data-f="svc.driver"><option value="">Todos los conductores</option>${S.drivers.map(d => opt(d.id, f.driver, d.name)).join('')}</select>

    <span class="banner info" style="padding:6px 10px;margin-left:auto;font-size:12px">${ic('info', 'sm')}Sin seguimiento GPS: se registran estados operativos (GPS: etapa de flota)</span>
  </div></div></div>
  <div class="grid split" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start">
    <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Hora</th><th>Servicio</th><th>Conductor</th><th>Estado operativo</th></tr></thead><tbody>
    ${list.length ? list.map(r => `<tr class="click ${sel && sel.id === r.id ? 'sel' : ''}" data-a="go" data-v="#/servicios/${r.id}"><td>${fmtDs(r.date)}</td><td class="mono">${r.time}</td><td><div class="strong">${esc(r.passenger.name)}</div><div class="muted" style="font-size:12px"><span class="mono">${r.id}</span> · ${esc(routeTxt(r))}</div></td><td>${esc(driverName(r.driverId))}</td><td>${badge(svcStatus(r), SVC_TONE[svcStatus(r)])}${r.incidents.some(i => !i.resolved) ? ' ' + badge('Incidencia', 't-red') : ''}</td></tr>`).join('') : `<tr><td colspan="5"><div class="empty">No hay servicios para los filtros elegidos.</div></td></tr>`}
    </tbody></table></div></div>
    <div class="stack">${sel && ASSIGNED.includes(sel.status) ? `<div class="card"><div class="card-h"><div><h3><span class="mono">${sel.id}</span> · ${esc(sel.passenger.name)}</h3><div class="sub">${fmtD(sel.date)} ${sel.time} · ${esc(routeTxt(sel))} · ${esc(driverName(sel.driverId))}</div></div><a class="btn sm" href="#/reserva/${sel.id}" style="margin-left:auto">Ficha</a></div>
      <div class="card-b">${stepper(sel)}
        <div class="lbl mt">Cronología de estados</div><ul class="timeline mt-s">${sel.serviceTrail.map(t => `<li><span class="dt ${t.s === 'Finalizado' ? 'g' : ''}"></span><div class="tt">${t.s}</div><div class="ts">${fmtDT(t.t)}</div></li>`).join('')}</ul>
        ${sel.status !== 'Finalizada' ? `<div class="banner info">${ic('phoneapp')}<span>El estado lo actualiza ${esc(firstName(driverName(sel.driverId)))} desde su app. <a href="#" data-a="asDriver" data-v="${sel.driverId}">Abrir su vista móvil</a> para simularlo.</span></div>` : ''}
        <div class="row between mt"><div class="lbl">Incidencias del servicio</div>${can.incident() ? `<button class="btn sm" data-a="newIncident" data-v="${sel.id}">${ic('plus', 'sm')}Agregar</button>` : ''}</div>
        ${sel.incidents.length ? sel.incidents.map(i => `<div class="banner ${i.resolved ? 'info' : 'err'} mt-s">${ic('alert')}<span style="flex:1"><b>${fmtDT(i.t)}</b> · ${esc(i.by)}<br>${esc(i.text)}</span>${!i.resolved && can.incident() ? `<button class="btn sm" data-a="resolveInc" data-v="${sel.id}" data-i="${i.id}">Marcar resuelta</button>` : i.resolved ? '<span class="pill">resuelta</span>' : ''}</div>`).join('') : '<div class="muted mt-s" style="font-size:13px">Sin incidencias registradas.</div>'}
      </div></div>` : '<div class="card"><div class="empty">Seleccioná un servicio.</div></div>'}
      <div class="card"><div class="card-h"><h3>Registro de incidencias</h3><span class="badge t-gray nodot" style="margin-left:auto">${incidents.length}</span></div>
      ${incidents.length ? incidents.map(i => `<a class="alert-it" href="#/servicios/${i.r.id}" style="color:inherit;text-decoration:none"><span class="ic ${i.resolved ? 'blue' : 'red'}">${ic('alert', 'sm')}</span><span><div class="ttl">${i.r.id} · ${esc(i.r.passenger.name)} ${i.resolved ? '<span class="pill">resuelta</span>' : ''}</div><div class="dsc">${esc(i.text)}</div><div class="muted" style="font-size:11.5px">${fmtDT(i.t)} · ${esc(i.by)}</div></span></a>`).join('') : '<div class="empty">Sin incidencias</div>'}</div>
    </div></div>`;
}

// ---------- 8. Liquidaciones ----------
function pLiquidaciones(key) {
  if (!U.liqWeek) U.liqWeek = addDays(weekStart(today()), -7);
  const ws = U.liqWeek; const rows = settlementRows(ws);
  const sel = key ? rows.find(x => x.key === key) : null;
  const weeks = [-14, -7, 0].map(o => addDays(weekStart(today()), o));
  const tot = { n: sum(rows, x => x.fin.length), total: sum(rows, x => x.total), drv: sum(rows, x => x.driver), co: sum(rows, x => x.company) };

  const unas = rs.filter(r => ['Pendiente de asignación', 'Consultando conductores'].includes(r.status));
  const [pa, pb] = period(p);
  const inq = S.inbox.filter(i => { const d = isoDate(new Date(i.at)); return d >= pa && d <= pb; });

  const perDay = days.map(d => ({ d, n: rs.filter(r => r.date === d && ASSIGNED.includes(r.status)).length }));

    ${K('Resueltas sin intervención adicional', done.length ? `${Math.round(noInt / done.length * 100)} %` : '—', `${noInt} de ${done.length} asignadas en el primer grupo · meta ≥ 90 %`)}
  </div>
  <div class="grid g4 mt">
    ${K('Reservas sin asignar', unas.length, `${unas.filter(r => r.noAcceptance).length} con alerta tras dos vueltas`)}

    ${K('Reservas confirmadas', done.length, lbl)}
    ${K('Conversión consulta → reserva', inq.length ? `${Math.round(conv.length / inq.length * 100)} %` : '—', 'Sólo canal bot · otros canales sin registro', `<span class="pill future" style="align-self:flex-start">${ic('clock', 'sm')}Multicanal: instrumentación futura</span>`)}
  </div>

function mobBody(d) {
  const reqs = S.reservations.flatMap(r => r.requests.filter(q => q.driverId === d.id && q.status === 'Pendiente').map(q => ({ r, q }))).sort((a, b) => resTs(a.r) - resTs(b.r));
  const trips = S.reservations.filter(r => r.driverId === d.id && ['Confirmada', 'En curso'].includes(r.status)).sort((a, b) => resTs(a) - resTs(b));
  const ws = weekStart(today());
  const wkAll = S.reservations.filter(r => r.driverId === d.id && r.date >= ws && r.date <= addDays(ws, 6) && ASSIGNED.includes(r.status));
  const wkFin = wkAll.filter(r => r.status === 'Finalizada');
  const settle = settlementRows(ws).find(x => x.id === d.id);
  if (U.mob === 'agenda') {
    const fin = S.reservations.filter(r => r.driverId === d.id && r.status === 'Finalizada').sort((a, b) => resTs(b) - resTs(a)).slice(0, 5);
    return `<div class="m-sec">Mis próximos viajes <span>${trips.length}</span></div>${trips.length ? trips.map(r => tripCard(r, true)).join('') : '<div class="m-card muted">No tenés viajes confirmados.</div>'}

      ${x.pending ? `<div class="hint mt-s">+${x.pending} viaje${x.pending > 1 ? 's' : ''} confirmado${x.pending > 1 ? 's' : ''} por realizar (${money(sum(x.svcs.filter(r => r.status !== 'Finalizada'), r => r.price) * .75)} estimado)</div>` : ''}
      <div class="mt-s">${x.fin.map(r => `<div class="row between" style="font-size:12.5px;padding:5px 0;border-top:1px solid var(--line-2)"><span>${fmtDs(r.date)} ${r.time} · ${esc(shortPlace(routeTxt(r)))}</span><b>${money(r.price * .75)}</b></div>`).join('')}</div></div>` : `<div class="m-card"><b>${title}</b><div class="muted mt-s">Sin viajes en este período.</div></div>`;
    return `<div class="banner warn" style="font-size:12px;margin-bottom:12px">${ic('info', 'sm')}<span>Liquidación simulada · reparto ${RULES.driverPct} % conductor / ${RULES.companyPct} % empresa.</span></div>${box(settle, 'Semana en curso')}${box(prev, 'Semana anterior')}`;
  }
