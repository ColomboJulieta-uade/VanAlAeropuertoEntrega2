      <div class="hint mt">Vos manejás tu disponibilidad. El equipo de reservas la usa como criterio para enviarte solicitudes, pero siempre podés aceptar o rechazar.</div></div>`;
  }
  // inicio
  const recent = S.reservations.flatMap(r => r.requests.filter(q => q.driverId === d.id && q.status !== 'Pendiente' && q.respondedAt && now() - q.respondedAt < 36 * 3600000).map(q => ({ r, q }))).sort((a, b) => b.q.respondedAt - a.q.respondedAt).slice(0, 3);
  return `<div class="m-stat"><div><b>${wkAll.length}</b><span>viajes esta semana</span></div><div><b>${reqs.length}</b><span>solicitudes nuevas</span></div><div><b>${trips.length}</b><span>próximos viajes</span></div></div>
    <div class="m-sec">Nueva solicitud ${reqs.length > 1 ? `<span>${reqs.length}</span>` : ''}</div>
    ${reqs.length ? reqs.map(({ r, q }) => `<div class="m-card req">

      <div class="m-big mt-s">${DOW_S[dow(r.date)]} ${fmtDs(r.date)} · ${r.time}</div>
      <div class="m-row">${ic('pin', 'sm')}<span><b>${esc(r.origin)}</b><br>→ ${esc(r.destination)}</span></div>
      <div class="m-row">${ic('plane', 'sm')}<span>${esc(AIRPORTS[r.airport].label)}${r.flight ? ` · vuelo <b class="mono">${esc(r.flight)}</b>` : ''}</span></div>
      <div class="m-row">${ic('car', 'sm')}<span>${esc(r.category)} · ${r.pax} pasajero${r.pax > 1 ? 's' : ''}</span></div>
      <div class="m-row">${ic('bag', 'sm')}<span>${r.luggage} valijas${r.equipment ? ` · ${esc(r.equipment)}` : ''}</span></div>
      ${r.notes ? `<div class="m-row">${ic('info', 'sm')}<span>${esc(r.notes)}</span></div>` : ''}
      <div class="row between mt-s" style="font-size:13px;background:#fff;border-radius:9px;padding:8px 10px;border:1px solid var(--line-2)"><span class="muted">Tu importe (${RULES.driverPct} %)</span><b>${money(r.price * RULES.driverPct / 100)}</b></div>
      <div class="m-btns"><button class="btn accept" data-a="accept" data-v="${r.id}">Aceptar servicio</button><button class="btn reject" data-a="reject" data-v="${r.id}">Rechazar servicio</button></div>
    </div>`).join('') : `<div class="m-card muted" style="font-size:13.5px">No tenés solicitudes pendientes.</div>`}
    ${recent.length ? recent.map(({ r, q }) => `<div class="row between" style="font-size:12.5px;padding:4px 4px"><span class="muted">${fmtDs(r.date)} ${r.time} · ${esc(shortPlace(routeTxt(r)))}</span>${badge(q.status === 'Cerrada' ? 'Asignada a otro' : q.status === 'Aceptada' && r.status === 'Consultando conductores' ? 'Aceptada · a confirmar' : q.status, q.status === 'Aceptada' ? 't-green' : REQ_TONE[q.status])}</div>`).join('') : ''}
    <div class="m-sec">Mis próximos viajes <a href="#" data-a="set" data-k="mob" data-v="agenda" style="text-transform:none;letter-spacing:0">Ver agenda</a></div>
    ${trips.length ? tripCard(trips[0], true) + trips.slice(1, 3).map(r => tripCard(r, false)).join('') : '<div class="m-card muted">No tenés viajes confirmados.</div>'}

    <div class="m-card" data-a="set" data-k="mob" data-v="liq" style="cursor:pointer"><div class="row between"><span>${wkFin.length} viaje${wkFin.length === 1 ? '' : 's'} · ${RULES.driverPct} % conductor</span>${settle ? badge(settle.status, SETTLE_TONE[settle.status]) : ''}</div><div class="m-big mt-s">${money(sum(wkFin, r => r.price) * .75)}</div><div class="muted" style="font-size:12px">sobre ${money(sum(wkFin, r => r.price))} en servicios finalizados · simulada</div></div>`;
}

// ---------- capas: drawer, modal, toasts ----------
function openLayer(html) { $('#layer').innerHTML = html; const f = $('#layer [autofocus]') || $('#layer input,#layer select,#layer textarea'); if (f) setTimeout(() => f.focus(), 30); }
function closeLayer() { $('#layer').innerHTML = ''; }
function toast(msg, kind = 'ok') {
  const el = document.createElement('div'); el.className = `toast ${kind}`; el.innerHTML = `${ic(kind === 'ok' ? 'check' : 'alert')}<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3600);
  const all = $('#toasts').children; while (all.length > 3) all[0].remove();
}
function modal(title, body, okLbl, okAction, okCls = 'pri', data = '') {
  openLayer(`<div class="scrim" data-a="close"></div><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mb"><h3>${title}</h3>${body}</div><div class="mf"><button class="btn" data-a="close">Volver</button><button class="btn ${okCls}" data-a="${okAction}" ${data}>${okLbl}</button></div></div>`);
}

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `registro_administrativo_${today()}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast(`Exportados ${rows.length} registros (CSV para Excel)`);
  } catch (e) { toast('El entorno no permite descargas: la exportación queda representada', 'err'); }
}

// ---------- render y eventos ----------
function render() {
  const ae = document.activeElement; const id = ae && ae.id; let pos = null; try { pos = ae.selectionStart; } catch (e) { }
  const mb = $('#mbody'); const mScroll = mb ? mb.scrollTop : 0;
  $('#app').innerHTML = S.role === 'conductor' ? mobileStage() : layout(parseRoute());
  if (id && !$('#layer').contains(ae)) { const n = document.getElementById(id); if (n && n !== ae) { n.focus(); try { if (pos != null) n.setSelectionRange(pos, pos); } catch (e) { } } }
  const mb2 = $('#mbody'); if (mb2) mb2.scrollTop = mScroll;
  live();
}
function live() {
  document.querySelectorAll('[data-clock]').forEach(e => e.textContent = fmtDT(now()));
  document.querySelectorAll('[data-clock-short]').forEach(e => e.textContent = fmtT(now()));
  document.querySelectorAll('[data-cd]').forEach(e => { const s = Math.max(0, RULES.responseMin * 60 - (now() - Number(e.dataset.cd)) / 1000); e.textContent = s <= 0 ? 'Plazo vencido' : s < 60 ? `Vence en ${Math.floor(s)} s` : `Vence en ${Math.ceil(s / 60)} min`; });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  const link = e.target.closest('a[href^="#/"]');
  if (link && (!el || link.contains(el) || !el.contains(link) || link === el)) {
    e.preventDefault();
    if (el && link.contains(el) && A[el.dataset.a] && el.dataset.a !== 'go') A[el.dataset.a](el.dataset, el, e);
    nav(link.getAttribute('href')); return;
  }
  if (!el) {
    let need = false;
    if ((U.notif || U.prof) && !e.target.closest('.dd')) { U.notif = U.prof = false; need = true; }
    if (U.search && !e.target.closest('.searchbox')) { U.search = ''; need = true; }
    if (need) render();
    return;
  }
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  if (el.dataset.a !== 'go' && el.closest('tr.click') && el !== el.closest('tr.click')) e.stopPropagation();
  fn(el.dataset, el, e);
});
document.addEventListener('submit', e => { if (e.target.id === 'resform') { e.preventDefault(); submitRes(); } });
function onField(e) {
  const el = e.target;
  if (el.closest('#resform')) { if (el.classList.contains('err')) { el.classList.remove('err'); const fe = el.closest('.field')?.querySelector('.ferr'); if (fe) fe.remove(); } if (el.hasAttribute('data-live')) liveForm(e); return; }
  if (el.dataset.a2 === 'pickDriver') { S.driverId = el.value; U.mob = 'inicio'; U.dispDays = U.dispFrom = U.dispTo = null; save(); render(); return; }
  const f = el.dataset.f; if (!f) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  setPath(U, f, val);
  if (f === 'incDraft' || f === 'dispFrom' || f === 'dispTo') return; // sin re-render para no perder lo escrito
  if (e.type === 'input' && el.tagName === 'SELECT') return;
  render();
}
document.addEventListener('input', e => { if (e.target.matches('input[type=text],input:not([type]),textarea,input[type=search]')) onField(e); else if (e.target.closest('#resform')) onField(e); });
document.addEventListener('change', e => { if (!e.target.matches('input:not([type]),input[type=text],textarea')) onField(e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#layer').innerHTML) closeLayer(); else if (U.notif || U.prof || U.search) { U.notif = U.prof = false; U.search = ''; render(); } } });
window.addEventListener('hashchange', () => { try { if (location.hash && location.hash !== ROUTE) nav(location.hash); } catch (e) { } });
// tooltips de gráficos
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); const tip = $('#tip'); if (t) { tip.textContent = t.dataset.tip; tip.style.display = 'block'; } else tip.style.display = 'none'; });
document.addEventListener('mousemove', e => { const tip = $('#tip'); if (tip.style.display === 'block') { tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; } });

// ---------- arranque ----------
S = load() || seed();
sessionStart = Date.now();
tick(); render();
setInterval(live, 1000);
setInterval(() => { if (tick()) { save(); render(); } }, 5000);
setInterval(save, 15000);
window.addEventListener('beforeunload', save);
window.addEventListener('pagehide', save);
</script>
</body>
